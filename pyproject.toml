[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webkey"
version = "0.1.0"
description = "WKD service with optional YunoHost integration"
readme = "DESIGN.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
